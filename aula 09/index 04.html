<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Aula 09 HTML</title>
</head>
<body>

    <!-- Lista não ordenadas -->

   

    <h2>Trabalhando com listas não ordenadas</h2>
 
    <!-- Exemplos de marcadores de listas não ordenadas-->
    <ul style="list-style-type: disc;">
        <li>Laranja</li>
        <li>Manga</li>
        <li>Carambola</li>
    </ul>

    <hr>

    <ul style="list-style-type: circle;">
        <ul>Café</ul>
        <ul>Suco</ul>
        <ul>Água</ul>
    </ul>

    <hr>
    <ul style="list-style-type: square;">
        <li>10</li>
        <li>40</li>
        <li>70</li>
    </ul>

    <hr>
    
    <ul style="list-style-type: none;">
        <li>Moto</li>
        <li>Carro</li>
        <li>Caminhão</li>
    </ul>

    <hr>

    <!-- Exemplos de listas não ordenadas alinhadas -->

    <h2>Listas alinhadas</h2>

    <ul>
        <li>Laranja</li>
        <li>Maça</li>
        <li>Banana</li>
        <ul>
            <ul>Carro</ul>
            <ul>Moto</ul>
            <ul>Barco</ul>
        </ul>
        <li>Pêra</li>
        <li>Uva</li>
    </ul>


  

   

</body>
</html>
